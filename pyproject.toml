[project]
name = "morphoclip"
version = "0.1.0"
description = "Text-Supervised Contrastive Learning for Perturbation Matching in Cell Painting Images"
authors = [{ name = "team", email = "suxrobgm@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14,<3.15"

dependencies = [
  "Pillow>=12.1.0",
  "numpy>=2.4.0",
  "PyYAML>=6.0.3",
  "pydantic>=2.12.0",
  "opencv-python>=4.13.0",
  "transformers>=5.3.0",
  "huggingface-hub>=1.7.0",
  "rich>=14.3.0",
  "typer>=0.26.8",
  "pandas>=3.0.0",
  "seaborn>=0.13.2",
  "matplotlib>=3.10.0",
  "scipy>=1.17.0",
  "scikit-image>=0.26.0",
  "python-dotenv>=1.2.0",
  "datasets>=3.6.0",
  "tensorboard>=2.20.0",
  "setuptools==81.0.0",
]

# PyTorch is installed via a selectable, mutually-exclusive extra that picks the right wheel index for your hardware.
#
#   uv sync --extra cpu        # CPU-only (Linux/Windows), or macOS (MPS)
#   uv sync --extra cu128      # CUDA 12.8 (RTX 50-series / Blackwell)
#   uv sync --extra cu130      # CUDA 13.0
[project.optional-dependencies]
cpu = ["torch>=2.10.0", "torchvision>=0.25.0"]
cu128 = ["torch>=2.10.0", "torchvision>=0.25.0"]
cu130 = ["torch>=2.10.0", "torchvision>=0.25.0"]

# Benchmark harness (mAP via copairs). Install with: uv sync --extra benchmark
benchmark = [
  "copairs @ git+https://github.com/cytomining/copairs@880f22a551bd897896d148a0b07baa99d981c6a9",
  "scikit-learn>=1.5.0",
]

[project.scripts]
morphoclip = "morphoclip.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/morphoclip", "src/cellclip", "src/benchmark"]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.15.0",
  "mypy>=1.19.0",
  "types-PyYAML>=6.0.12",
  "poethepoet>=0.30.0",
  "pandas-stubs>=3.0.5.260730",
]

[tool.uv]
package = true
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }, { extra = "cu130" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform != 'darwin'" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform != 'darwin'" },
]

[tool.poe.tasks]
test = "pytest"
test-cov = "pytest --cov --cov-report=term-missing --cov-report=xml"
test-realdata = "pytest -m realdata"
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "mypy src"
check = ["format-check", "lint", "typecheck", "test"]

train = "morphoclip train --config configs/train/base.yaml"
benchmark = "morphoclip benchmark --config configs/benchmark.yml"
tensorboard = "python -m tensorboard.main --logdir output/morphoclip_runs"

report = "latexmk -pdf -r report/.latexmkrc -cd report/main.tex"
report-clean = { script = "shutil:rmtree('report/build', ignore_errors=True)" }
report-arxiv = "python scripts/report/make_arxiv.py"

inspect-dataset = "python scripts/data/inspect_dataset.py"
inspect-perturbation = "python scripts/data/inspect_perturbation.py"
inspect-text = "python scripts/text/inspect_text_embeddings.py"
downsampling-inspection = "python scripts/features/downsampling_inspection.py"
dino-heatmap-inspection = "python scripts/features/dino_heatmap_inspection.py"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "scripts"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # import sorting
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # collapsible ifs, contextlib.suppress, ternaries
  "C4",   # comprehensions
  "RET",  # assign-then-return
  "PIE",  # incl. PIE810, multiple startswith/endswith in the column parsers
  "ISC",  # implicit string concat, easy to do by accident in the literal tables
  "FURB", # modern stdlib idioms
  "ERA",  # commented-out code, which a big refactor invites
  "RUF",  # incl. RUF100 (stale noqa) and RUF022 (unsorted __all__)
  "TID",  # no relative imports; the layering ban lands here once the layout is final
  "ARG",  # dead parameters
  "PT",   # pytest style
  "T20",  # library code must not print
  "PLC",
  "PLE",
  "PLW",  # incl. PLW1510, subprocess.run without check
  "LOG",
  "G",    # logging call shape
  "DTZ",  # naive datetime
]
ignore = [
  # Optional extras (copairs, sklearn) are imported inside command bodies on
  # purpose, so `morphoclip --help` works without them installed.
  "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
# Report printers and dev scripts are presentation layers; converting their
# ~110 print calls to logging is its own job.
"src/benchmark/*" = ["T20"]
"src/cellclip/*" = ["T20"]
"scripts/*" = ["T20"]
# Mixes 19 bare prints with rich output. Both go when this file is split.
"src/morphoclip/cli/cellclip_cmds.py" = ["T20"]
# Tests print for debugging and take fixtures purely for their side effects.
"tests/*" = ["T20", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["morphoclip", "cellclip", "benchmark"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

# Only these third-party packages ship no usable stubs. A blanket
# ignore_missing_imports hides real typos in first-party import paths.
[[tool.mypy.overrides]]
module = ["copairs.*", "cv2.*", "seaborn.*", "skimage.*", "sklearn.*", "torchvision.*", "tqdm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not realdata'"
markers = [
  "realdata: needs the downloaded data/ tree; excluded from the default run",
  "slow: takes more than a couple of seconds",
]
# Warnings are errors so a torch or pandas deprecation cannot land silently.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
# Measured, not aspirational: 43% over all of src/ (60% over src/morphoclip alone).
# `benchmark` and `cellclip` are frozen and deliberately untested, which is most of
# the gap. Treat this as a ratchet: raise it when coverage rises, never lower it.
fail_under = 40
